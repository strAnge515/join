<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Login</title>
    <link rel="icon" type="image/png" href="./assets/img/join_logo.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/startseite.css" />
    <script type="module" src="./scripts/login.js" defer></script>
    <script type="module" src="./scripts/signup.js" defer></script>
  </head>

  <body class="">
    <div class="start-screen-background" >
    <div class="start-screen-logo" id="startScreen">
      <svg
        width="101"
        height="122"
        viewBox="0 0 101 122"

    </div>
    
      <header id="login-header-desktop" class="login-header-desktop">
        <p>Not a Join user?</p>
        <button id="sign-up-button" class="sign-up-button">Sign up</button>
      </header>
      <main>
        <form id="login-form" novalidate>
          <h1>Log in</h1>
          <div class="seperator"></div>

          <div class="input">
            <div class="input-field-wrapper">
              <input type="text" id="login-email" placeholder="Email" />
              <img
                src="./assets/img/contacts/mail.svg"
                alt=""
                class="input-icon"
              />
            </div>

            <div class="input-field-wrapper">
              <input
                type="password"
                id="login-password"
                placeholder="Password"
              />
              <img
                src="./assets/img/lock.svg"
                alt=""
                class="input-icon input-icon--toggle"
                id="toggle-password"
              />
            </div>
          </div>

          <p class="error-message" id="login-error"></p>

          <div class="login">
            <button type="submit" class="log-in-button">Log in</button>
            <button
              type="button"
              id="guest-login-btn"
              class="guest-log-inbutton"
            >
              Guest Log in
            </button>
          </div>
        </form>
        <form id="signup-form" novalidate>
          <button class="back-arrow" id="back-arrow">
          </button>
          <h1>Sign up</h1>
          <div class="seperator"></div>
          <div class="sign-up-input">
            <div class="signup-field">
              <div class="input-field-wrapper">
                <input type="text" id="signup-name" placeholder="Name" />
                <img
                  src="./assets/img/contacts/person.svg"
                  alt=""
                  class="input-icon"
                />
              </div>
              <small class="signup-field-error" id="signup-name-error"></small>
            </div>
            <div class="signup-field">
              <div class="input-field-wrapper">
                <input type="email" id="signup-email" placeholder="Email" />
                <img
                  src="./assets/img/contacts/mail.svg"
                  alt=""
                  class="input-icon"
                />
              </div>
              <small class="signup-field-error" id="signup-email-error"></small>
            </div>
            <div class="signup-field">
              <div class="input-field-wrapper">
                <input
                  type="password"
                  id="signup-password"
                  placeholder="Password"
                />
                <img
                  src="./assets/img/lock.svg"
                  alt=""
                  class="input-icon input-icon--toggle"
                  id="toggle-signup-password"
                />
              </div>
              <small
                class="signup-field-error"
                id="signup-password-error"
              ></small>
            </div>
            <div class="signup-field">
              <div class="input-field-wrapper">
                <input
                  type="password"
                  id="signup-confirm-password"
                  placeholder="Confirm Password"
                />
                <img
                  src="./assets/img/lock.svg"
                  alt=""
                  class="input-icon input-icon--toggle"
                  id="toggle-confirm-password"
                />
              </div>
              <small
                class="signup-field-error"
                id="signup-confirm-error"
              ></small>
            </div>
          </div>
          <div class="privacy-policy-wrapper">
            <input type="checkbox" id="accept-privacy" />
            <label for="accept-privacy"
              >I accept the
              <a href="./privacy_policy.html" class="privacy-link"
                >Privacy policy</a
              ></label
            >
          </div>
          <button type="submit" class="log-in-button" id="signup-btn" disabled>
            Sign up
          </button>
        </form>
              <header id="login-header-mobile" class="login-header-mobile">
        <p>Not a Join user?</p>
        <button class="sign-up-button">Sign up</button>
      </header>
      </main>

    <div class="toast-message" id="signup-toast">You Signed Up successfully</div>

      <footer class="login-footer">
        <a href="./pages/privacy_policy.html">Privacy Policy</a>
        <a href="./pages/legal_notice.html">Legal notice</a>
      </footer>
    </div>
  </body>
</html>
